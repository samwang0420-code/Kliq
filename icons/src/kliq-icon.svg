<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#144055"/>
      <stop offset="1" stop-color="#071623"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FEBD3"/>
      <stop offset="1" stop-color="#1499C6"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#8CF9E7"/>
      <stop offset="0.55" stop-color="#2ED3CD"/>
      <stop offset="1" stop-color="#0FA8C4"/>
    </radialGradient>
    <radialGradient id="dotglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FEBD3" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#4FEBD3" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4FEBD3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>

  <g fill="none" stroke="url(#ring)" stroke-linecap="round">
    <!-- outer ring: 300deg arc -->
    <circle cx="512" cy="512" r="330" pathLength="100" stroke-dasharray="83 17"
            stroke-dashoffset="-8" stroke-width="26" transform="rotate(-30 512 512)"/>
    <!-- thin full ring -->
    <circle cx="512" cy="512" r="268" pathLength="100" stroke-dasharray="94 6"
            stroke-dashoffset="-20" stroke-width="9" opacity="0.65"/>
    <!-- mid thick arc -->
    <circle cx="512" cy="512" r="206" pathLength="100" stroke-dasharray="70 30"
            stroke-dashoffset="-38" stroke-width="34" transform="rotate(120 512 512)"/>
    <!-- thin arc -->
    <circle cx="512" cy="512" r="146" pathLength="100" stroke-dasharray="88 12"
            stroke-dashoffset="-62" stroke-width="14" transform="rotate(60 512 512)"/>
    <!-- inner thick arc -->
    <circle cx="512" cy="512" r="92" pathLength="100" stroke-dasharray="58 42"
            stroke-dashoffset="-12" stroke-width="34" transform="rotate(200 512 512)"/>
  </g>

  <circle cx="512" cy="512" r="150" fill="url(#dotglow)"/>
  <circle cx="512" cy="512" r="50" fill="url(#dot)"/>
</svg>
