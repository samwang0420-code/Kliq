name: Update Homebrew Tap

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to Homebrew tap (e.g. v1.0.5)"
        required: true
        type: string
      tap_repo:
        description: "Tap repository in owner/repo format (must be a repo you own)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: ${{ github.event.inputs.tap_repo || vars.HOMEBREW_TAP_REPO || '' }}
      AUTO_MERGE_TAP_PR: ${{ vars.HOMEBREW_TAP_AUTO_MERGE || 'true' }}
    steps:
      - name: Validate token
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN secret is not set."
            exit 1
          fi

      - name: Validate tap target
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TAP_REPO}" ]; then
            echo "No tap repository configured."
            echo "Set the HOMEBREW_TAP_REPO repository variable, or pass tap_repo when dispatching."
            echo "This workflow deliberately has NO default tap: it must never publish to a tap"
            echo "we do not own."
            exit 1
          fi

          # Guard against publishing into a third-party tap by accident.
          TAP_OWNER="${TAP_REPO%%/*}"
          REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
          if [ "${TAP_OWNER}" = "${REPO_OWNER}" ]; then
            echo "Tap target: ${TAP_REPO}"
            exit 0
          fi

          if [ "${ALLOW_EXTERNAL_TAP:-false}" = "true" ]; then
            echo "WARNING: publishing to external tap ${TAP_REPO} (ALLOW_EXTERNAL_TAP=true)"
            exit 0
          fi

          echo "Refusing to publish to a tap owned by '${TAP_OWNER}' while this repo is owned by '${REPO_OWNER}'."
          echo "Set the ALLOW_EXTERNAL_TAP repository variable to 'true' if this is intentional."
          exit 1

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"

          if [ -z "$TAG" ]; then
            echo "Release tag is empty"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kliq-release
          # electron-builder.json5 sets artifactName to "Kliq-${version}-${arch}.${ext}",
          # so the published macOS assets are Kliq-1.4.0-arm64.dmg / Kliq-1.4.0-x64.dmg.
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir /tmp/kliq-release \
            --pattern "Kliq-*-arm64.dmg" \
            --pattern "Kliq-*-x64.dmg"

      - name: Compute checksums
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          ARM_FILE=$(find /tmp/kliq-release -maxdepth 1 -name 'Kliq-*-arm64.dmg' | head -n 1)
          INTEL_FILE=$(find /tmp/kliq-release -maxdepth 1 -name 'Kliq-*-x64.dmg' | head -n 1)

          if [ -z "$ARM_FILE" ] || [ -z "$INTEL_FILE" ]; then
            echo "Unable to locate macOS release artifacts for ${{ steps.tag.outputs.tag }}"
            echo "Expected Kliq-*-arm64.dmg and Kliq-*-x64.dmg in the release assets."
            exit 1
          fi

          SHA_ARM=$(sha256sum "$ARM_FILE" | awk '{print $1}')
          SHA_INTEL=$(sha256sum "$INTEL_FILE" | awk '{print $1}')
          echo "arm=$SHA_ARM" >> "$GITHUB_OUTPUT"
          echo "intel=$SHA_INTEL" >> "$GITHUB_OUTPUT"
          echo "arm_file=$(basename "$ARM_FILE")" >> "$GITHUB_OUTPUT"
          echo "intel_file=$(basename "$INTEL_FILE")" >> "$GITHUB_OUTPUT"

      - name: Clone tap repository
        shell: bash
        run: |
          gh repo clone "$TAP_REPO" /tmp/homebrew-tap
          git -C /tmp/homebrew-tap remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git"

      - name: Update cask file
        id: update
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/homebrew-tap
          mkdir -p Casks

          BRANCH="kliq-cask-${{ steps.tag.outputs.tag }}"
          git checkout -B "$BRANCH"

          cat > Casks/kliq.rb <<'RUBY'
          cask "kliq" do
            version "__VERSION__"

            on_arm do
              sha256 "__SHA_ARM__"
              url "https://github.com/__REPO__/releases/download/__TAG__/__ARM_FILE__"
            end

            on_intel do
              sha256 "__SHA_INTEL__"
              url "https://github.com/__REPO__/releases/download/__TAG__/__INTEL_FILE__"
            end

            name "Kliq"
            desc "Open-source screen recorder and editor with AI captions"
            homepage "https://yanjingai.tech"

            app "Kliq.app"
          end
          RUBY

          sed -i "s/__VERSION__/${{ steps.tag.outputs.version }}/g" Casks/kliq.rb
          sed -i "s/__SHA_ARM__/${{ steps.sha.outputs.arm }}/g" Casks/kliq.rb
          sed -i "s/__SHA_INTEL__/${{ steps.sha.outputs.intel }}/g" Casks/kliq.rb
          sed -i "s#__REPO__#${{ github.repository }}#g" Casks/kliq.rb
          sed -i "s#__TAG__#${{ steps.tag.outputs.tag }}#g" Casks/kliq.rb
          sed -i "s#__ARM_FILE__#${{ steps.sha.outputs.arm_file }}#g" Casks/kliq.rb
          sed -i "s#__INTEL_FILE__#${{ steps.sha.outputs.intel_file }}#g" Casks/kliq.rb

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kliq.rb
          git commit -m "chore(cask): update kliq to ${{ steps.tag.outputs.tag }}"
          git push --force-with-lease origin "$BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request in tap repo
        if: steps.update.outputs.changed == 'true'
        id: pr
        shell: bash
        run: |
          cd /tmp/homebrew-tap

          PR_NUMBER=$(gh pr list --head "${{ steps.update.outputs.branch }}" --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            echo "PR already exists for ${{ steps.update.outputs.branch }} (#$PR_NUMBER)"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_URL=$(gh pr create \
            --title "chore(cask): update kliq to ${{ steps.tag.outputs.tag }}" \
            --body "Automated cask update for ${{ steps.tag.outputs.tag }}.\n\n- arm64 sha256: \\`${{ steps.sha.outputs.arm }}\\`\n- x64 sha256: \\`${{ steps.sha.outputs.intel }}\\`" \
            --head "${{ steps.update.outputs.branch }}" \
            --base main)

          PR_NUMBER=$(echo "$PR_URL" | sed -E 's#.*/pull/([0-9]+).*#\1#')
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Auto-merge tap PR
        if: steps.update.outputs.changed == 'true' && env.AUTO_MERGE_TAP_PR == 'true'
        shell: bash
        run: |
          cd /tmp/homebrew-tap

          PR_NUMBER="${{ steps.pr.outputs.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request number available; skipping auto-merge."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --squash --delete-branch --repo "$TAP_REPO"
