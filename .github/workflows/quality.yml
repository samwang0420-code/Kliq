name: Code Quality

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc --noEmit

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting (advisory)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: npm run format:check

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # i18n-check 曾经是 advisory，原因是脚本扫目录取语言列表，被未注册的残留目录
      # 搞成一直 exit 1（门禁形同虚设）。现已改为从 src/i18n/config.ts 的
      # SUPPORTED_LOCALES 读取并做双向对齐，通过后即改为阻塞。
      - name: Check translations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run i18n:check

      # 落地页是手写单文件 HTML，走自己的 data-bind + 内嵌文案表，不经过任何
      # 构建期校验：一个漏登记的绑定、一个空 href 的购买按钮、一段写错的内嵌脚本，
      # 都能在「应用里一切正常」的情况下悄悄上线。这条门禁就是补这个盲区。
      - name: Check landing site
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run verify:site
