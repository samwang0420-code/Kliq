name: Release Yanjing Recorder

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build native helpers (skip whisper.cpp)
        run: |
          npm run build:windows-capture || echo "Skipped windows-capture on ${{ matrix.os }}"
          npm run build:nvidia-cuda-compositor || echo "Skipped nvidia-cuda on ${{ matrix.os }}"
          npm run build:cursor-monitor || echo "Skipped cursor-monitor on ${{ matrix.os }}"

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build Vite
        run: npx vite build --config vite.config.ts

      - name: Normalize Electron main CJS
        run: node scripts/normalize-electron-main-cjs.mjs

      - name: Smoke test Electron main CJS
        run: node scripts/smoke-electron-main-cjs.mjs

      - name: Build Electron app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npx electron-builder --mac --publish never
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            npx electron-builder --win --publish never
          else
            npx electron-builder --linux --publish never
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yanjing-recorder-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
